name: Update Abidely feed

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get newest videos
        run: node update-feed.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Save feed.json
        run: |
          git config user.name "abidely-bot"
          git config user.email "abidely-bot@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || (git commit -m "Update feed" && git push)
